[project]
name = "rag-gis-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "google-genai>=2.18.1",
    "langchain>=1.3.15",
    "langchain-chroma>=1.1.0",
    "langchain-google-genai>=4.3.3",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.52.3",
]

[project.scripts]
rag-gis-api = "rag_gis_api.app:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.3",
]
